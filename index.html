<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>canvas-editor - 选择入口</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      width: 100%;
    }

    .title {
      text-align: center;
      color: white;
      margin-bottom: 60px;
      font-size: 36px;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      text-decoration: none;
      display: block;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .card-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .card-icon svg {
      width: 40px;
      height: 40px;
    }

    .card:nth-child(1) .card-icon {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }

    .card:nth-child(2) .card-icon {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    }

    .card:nth-child(3) .card-icon {
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    }

    .card:nth-child(4) .card-icon {
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    }

    .card-title {
      font-size: 22px;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
    }

    .card-desc {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }

    .card-icon svg {
      fill: white;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="title">canvas-editor</h1>
    <div class="cards">
      <a href="blank.html" class="card">
        <div class="card-icon">
          <svg viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
            <polyline points="14,2 14,8 20,8" fill="none" stroke="white" stroke-width="2"/>
            <line x1="12" y1="18" x2="12" y2="12" stroke="white" stroke-width="2"/>
            <line x1="9" y1="15" x2="15" y2="15" stroke="white" stroke-width="2"/>
          </svg>
        </div>
        <div class="card-title">新建空白文档</div>
        <div class="card-desc">从零开始创建<br/>一个空白文档</div>
      </a>

      <a href="docx.html" class="card">
        <div class="card-icon">
          <svg viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
            <polyline points="14,2 14,8 20,8" fill="none" stroke="white" stroke-width="2"/>
            <text x="8" y="17" font-size="6" fill="white" font-weight="bold">DOCX</text>
          </svg>
        </div>
        <div class="card-title">导入 DOCX</div>
        <div class="card-desc">导入现有的<br/>Word 文档</div>
      </a>

      <a href="excel.html" class="card">
        <div class="card-icon">
          <svg viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
            <polyline points="14,2 14,8 20,8" fill="none" stroke="white" stroke-width="2"/>
            <text x="7" y="17" font-size="6" fill="white" font-weight="bold">XLSX</text>
          </svg>
        </div>
        <div class="card-title">导入 Excel</div>
        <div class="card-desc">导入现有的<br/>Excel 表格</div>
      </a>

      <a href="example.html" class="card">
        <div class="card-icon">
          <svg viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
            <polyline points="14,2 14,8 20,8" fill="none" stroke="white" stroke-width="2"/>
            <path d="M8 13h2m0 0h2m-2 0v4m0-4h2m2 0h2" stroke="white" stroke-width="1.5" fill="none"/>
          </svg>
        </div>
        <div class="card-title">示例文档</div>
        <div class="card-desc">查看编辑器的<br/>功能示例</div>
      </a>
    </div>
  </div>
</body>

</html>
